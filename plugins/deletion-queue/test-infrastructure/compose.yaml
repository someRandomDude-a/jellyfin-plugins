name: deletion-queue-tests
services:
  jellyfin:
    image: ${JELLYFIN_TEST_IMAGE:?Resolve the current stable Jellyfin image for this run; no older-image fallback}
    pull_policy: always
    network_mode: none
    environment:
      JELLYFIN_PublishedServerUrl: http://127.0.0.1:8096
    volumes:
      - config:/config
      - cache:/cache
      - type: bind
        source: ${PLUGIN_TEST_DIRECTORY:-../artifacts/plugin/linux-x64}
        target: /config/plugins/DeletionQueue_${PLUGIN_TEST_VERSION:-0.1.0.0}
  smoke:
    image: python:alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    pull_policy: always
    network_mode: service:jellyfin
    depends_on:
      - jellyfin
    volumes:
      - ./smoke.py:/tests/smoke.py:ro
    command: ["python", "/tests/smoke.py"]
volumes:
  config:
  cache:
