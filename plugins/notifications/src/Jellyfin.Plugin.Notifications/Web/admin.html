<!doctype html><html><head><title>Notifications</title></head><body>
<div id="notificationsAdmin" data-suite-plugin="notifications" data-role="page" class="page type-interior pluginConfigurationPage suiteAdmin"><div data-role="content"><div class="content-primary"><h2 class="sectionTitle" data-help="Manage the shared inbox and delivery routes. Discord delivery requires Discord Bridge.">Notifications</h2><div data-notification-settings></div><p role="status" data-status></p></div></div>
<script>
(() => {
    'use strict';
    const page = document.querySelector('#notificationsAdmin');
    if (!page || page.dataset.notificationsInitialized) return;
    page.dataset.notificationsInitialized = 'true';
    let dispose, loading = false, generation = 0, controller;
    async function show() {
        if (loading || dispose) return;
        loading = true; const current = ++generation; controller = new AbortController(); const signal = controller.signal;
        page.querySelector('[data-status]').textContent = '';
        try {
            if (!window.AccountHubNotificationSettings) await new Promise((resolve, reject) => {
                const script = document.createElement('script'); script.src = ApiClient.getUrl('Notifications/assets/settings.js'); script.onload = resolve; script.onerror = reject; document.head.append(script);
            });
            if (signal.aborted || current !== generation) return;
            const cleanup = await window.AccountHubNotificationSettings.mount(page.querySelector('[data-notification-settings]'), async (path, method = 'GET', body) => {
                if (signal.aborted) throw new DOMException('View changed', 'AbortError');
                const response = await ApiClient.ajax({ url: ApiClient.getUrl('Notifications/api/v1/' + path), type: method, contentType: 'application/json', dataType: 'json', data: body === undefined ? undefined : JSON.stringify(body) });
                if (signal.aborted) throw new DOMException('View changed', 'AbortError');
                if (!response.ok) throw new Error('Notification settings unavailable. Check authorization and storage.');
                return response.data;
            }, { signal });
            if (signal.aborted || current !== generation) cleanup(); else dispose = cleanup;
        } catch {
            if (!signal.aborted && current === generation) page.querySelector('[data-status]').textContent = 'Could not load settings. Check administrator access and storage, then reopen this page.';
        } finally { if (current === generation) loading = false; }
    }
    function hide() { generation++; controller?.abort(); controller = null; dispose?.(); dispose = null; loading = false; }
    page.addEventListener('viewshow', show);
    for (const name of ['viewhide', 'viewdestroy']) page.addEventListener(name, hide);
    show();
})();
</script><script src="configurationpage?name=NotificationsAdminUI.js"></script></div></body></html>
