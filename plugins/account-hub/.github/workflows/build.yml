name: build
on: [push, pull_request]
jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AccountHub.slnx
      - run: dotnet build AccountHub.slnx -c Release --no-restore
      - run: dotnet test AccountHub.slnx -c Release --no-build
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/AccountHub.Core
      - shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AccountHub-foundation-preview-${{ matrix.os }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
