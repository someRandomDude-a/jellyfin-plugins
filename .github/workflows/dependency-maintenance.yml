name: Dependency maintenance
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [dependency-update]
permissions:
  contents: read
concurrency:
  group: dependency-discovery
  cancel-in-progress: false
jobs:
  residual:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: node
      - name: Discover only embedded tools, images and upstream markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-dependencies.mjs --apply --residual
      - name: Publish dependency-only PR from trusted tooling
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDENCY_BOT_LOGIN: ${{ vars.DEPENDENCY_BOT_LOGIN }}
        run: node scripts/publish-residual-update.mjs
