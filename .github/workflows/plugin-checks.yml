name: Plugin checks
on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
      ref:
        type: string
        required: false
      package_tag:
        type: string
        default: v0.2.0
      targets_artifact:
        type: string
        default: ''
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  targets:
    uses: ./.github/workflows/latest-targets.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      targets_artifact: ${{ inputs.targets_artifact }}
      key: ${{ inputs.plugin }}
  unit:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.targets.outputs.node_version }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - name: Install shared frontend test harness
        run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Selected plugin and common/dependency tests only
        shell: pwsh
        env:
          PLUGIN: ${{ inputs.plugin }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-plugin.ps1 -Plugin $env:PLUGIN
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tests-${{ inputs.plugin }}-${{ matrix.os }}
          path: '**/TestResults/*.trx'
  installed:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.targets.outputs.node_version }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - if: inputs.plugin == 'private-syncplay'
        run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Package only the selected plugin
        shell: pwsh
        env:
          PLUGIN: ${{ inputs.plugin }}
          PACKAGE_TAG: ${{ inputs.package_tag }}
        run: ./scripts/package.ps1 -Tag $env:PACKAGE_TAG -Plugin $env:PLUGIN -OutputDirectory artifacts/plugin-packages
      - name: Standalone installed plugin with and without native Security
        shell: pwsh
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          $keys = @{ 'account-hub'='hub'; 'discord-bridge'='discord'; 'private-syncplay'='syncplay'; 'deletion-queue'='deletion'; 'notifications'='notifications'; 'automatic-deletion-requests'='automatic' }
          $library = if ($env:PLUGIN -eq 'notifications') { @('--library') } else { @() }
          $studio = if ($env:PLUGIN -eq 'notifications') { @('--notification-studio') } else { @() }
          node scripts/integration.mjs --packages=artifacts/plugin-packages "--plugins=$($keys[$env:PLUGIN])" --notifications-restart @library @studio
          if ($LASTEXITCODE) { throw 'Standalone installed test failed' }
          node scripts/integration.mjs --packages=artifacts/plugin-packages "--plugins=$($keys[$env:PLUGIN])" --security=latest --notifications-restart @library
          if ($LASTEXITCODE) { throw 'Standalone Security compatibility failed' }
      - name: Full native SyncPlay, guest media and SDK consumer integration
        if: inputs.plugin == 'private-syncplay'
        shell: pwsh
        working-directory: plugins/private-syncplay
        run: |
          dotnet build examples/WatchPartyConsumer -c Release
          if ($LASTEXITCODE) { throw 'Consumer build failed' }
          ./scripts/package.ps1
          node scripts/integration.mjs --with-consumer --install-from-catalog
          if ($LASTEXITCODE) { throw 'Native SyncPlay integration failed' }
