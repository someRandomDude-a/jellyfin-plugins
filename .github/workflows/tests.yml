name: Independent plugin checks and interoperability
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      targets_artifact:
        type: string
        default: ''
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targets:
    uses: ./.github/workflows/latest-targets.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      targets_artifact: ${{ inputs.targets_artifact || '' }}
      key: tests
  workflow-lint:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate workflow syntax, expressions and shell snippets
        run: docker run --rm --pull=always --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  plugin:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        plugin: [account-hub, discord-bridge, private-syncplay, deletion-queue, notifications, automatic-deletion-requests]
    uses: ./.github/workflows/plugin-checks.yml
    with:
      plugin: ${{ matrix.plugin }}
      ref: ${{ inputs.ref || github.sha }}
      targets_artifact: ${{ needs.targets.outputs.artifact }}
  installed-browser:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Build local-only disposable packages
        shell: pwsh
        run: ./scripts/package.ps1 -Tag v0.2.0 -Runtime linux-x64 -OutputDirectory artifacts/browser-packages
      - name: Installed native themes and notification browser checks (no public tunnel or credentials)
        run: node scripts/integration.mjs --packages=artifacts/browser-packages --permissions-check --wiring-check --library --theme-check --notification-studio --account-responsive --v1-flows --database-safety --storage-recovery --root="${{ runner.temp }}/suite-browser-fixture"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: installed-theme-results
          path: |
            ${{ runner.temp }}/suite-browser-fixture/theme-results.json
            ${{ runner.temp }}/suite-browser-fixture/account-responsive-results.json
            ${{ runner.temp }}/suite-browser-fixture/studio-results.json
            ${{ runner.temp }}/suite-browser-fixture/studio-screenshots/*.png
  root:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Full consolidated test and upgrade gates on the same latest targets
        shell: pwsh
        run: ./scripts/test.ps1
