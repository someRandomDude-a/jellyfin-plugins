name: Independent plugin checks and interoperability
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate workflow syntax, expressions and shell snippets
        run: docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
  plugin:
    strategy:
      fail-fast: false
      matrix:
        plugin: [account-hub, discord-bridge, private-syncplay, deletion-queue]
    uses: ./.github/workflows/plugin-checks.yml
    with:
      plugin: ${{ matrix.plugin }}
      ref: ${{ inputs.ref || github.sha }}
  installed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - run: npm ci --ignore-scripts
        working-directory: plugins/discord-bridge/activity
      - name: Build local-only disposable packages
        shell: pwsh
        run: ./scripts/package.ps1 -Tag v0.2.0 -Runtime linux-x64 -OutputDirectory artifacts/browser-packages
      - name: Installed native themes and Activity failure-state browser checks (no public tunnel or credentials)
        run: node scripts/integration.mjs --packages=artifacts/browser-packages --theme-check --root="${{ runner.temp }}/suite-browser-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-theme-results
          path: '${{ runner.temp }}/suite-browser-fixture/theme-results.json'
