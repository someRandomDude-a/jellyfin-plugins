name: Release plugins
on:
  push:
    tags: ['account-hub/v*', 'discord-bridge/v*', 'private-syncplay/v*', 'deletion-queue/v*', 'notifications/v*', 'automatic-deletion-requests/v*']
  workflow_dispatch:
    inputs:
      plugin:
        description: Release the suite or one independent plugin
        type: choice
        default: all
        options: [all, account-hub, discord-bridge, private-syncplay, deletion-queue, notifications, automatic-deletion-requests]
      version:
        description: 'Immutable version (for example v0.3.1); plugin prefix is automatic'
        required: true
        type: string
      ref:
        description: 'Optional exact source commit (dependency automation uses the tested merge SHA)'
        required: false
        type: string
      expected_commit:
        description: 'Optional fail-closed exact commit assertion'
        required: false
        type: string
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: release-${{ inputs.plugin || 'tag' }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  targets:
    uses: ./.github/workflows/latest-targets.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      key: release
  verify-ref:
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version_tag: ${{ steps.ref.outputs.version_tag }}
      plugin: ${{ steps.ref.outputs.plugin }}
      published: ${{ steps.ref.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - id: ref
        # No tag or publication happens until current tools/source pass preflight.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          PLUGIN: ${{ inputs.plugin || 'all' }}
          TAG_PUSH: ${{ github.event_name == 'push' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node scripts/check-dependency-freshness.mjs
          if ($LASTEXITCODE) { throw 'Run and merge dependency maintenance before releasing this immutable source' }
          if ($env:TAG_PUSH -eq 'true') {
            if ($env:RELEASE_TAG -cnotmatch '^(account-hub|discord-bridge|private-syncplay|deletion-queue|notifications|automatic-deletion-requests)/(v\d+\.\d+\.\d+)$') { throw 'Expected plugin/vX.Y.Z tag' }
            $env:PLUGIN = $Matches[1]; $versionTag = $Matches[2]
          } else {
            if ($env:PLUGIN -notin @('all','account-hub','discord-bridge','private-syncplay','deletion-queue','notifications','automatic-deletion-requests')) { throw 'Unknown plugin' }
            if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Enter a version such as v0.3.1' }
            $versionTag = $env:RELEASE_TAG
            if ($env:PLUGIN -ne 'all') { $env:RELEASE_TAG = "$env:PLUGIN/$versionTag" }
          }
          if ($env:EXPECTED_COMMIT -and ((git rev-parse HEAD) -cne $env:EXPECTED_COMMIT -or $env:EXPECTED_COMMIT -cnotmatch '^[a-f0-9]{40}$')) { throw 'Checkout differs from tested immutable source' }
          git fetch --tags
          if ($LASTEXITCODE) { throw 'Cannot read immutable tags' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $commit = git rev-parse "$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE) { throw 'Cannot resolve existing tag' }
            if ($env:EXPECTED_COMMIT -and $commit -cne $env:EXPECTED_COMMIT) { throw 'Existing immutable tag belongs to another commit' }
            $selectedCommit = git rev-parse HEAD
            if ($LASTEXITCODE) { throw 'Cannot resolve selected release source' }
            node scripts/assert-release-source.mjs "$selectedCommit" "$commit"
            if ($LASTEXITCODE) { throw 'Release source differs from the existing immutable tag; use a new version for the fixes' }
          } else {
            if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect immutable tag' }
            git tag $env:RELEASE_TAG HEAD
            if ($LASTEXITCODE) { throw 'Tag creation failed' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE) { throw 'Tag push failed; no tag will be overwritten' }
          }
          $tags = @(gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft == false) | .tag_name')
          if ($LASTEXITCODE) { throw 'Cannot inspect published releases' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version_tag=$versionTag" >> $env:GITHUB_OUTPUT
          "plugin=$env:PLUGIN" >> $env:GITHUB_OUTPUT
          "published=$(([bool]($tags -ccontains $env:RELEASE_TAG)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  checks:
    needs: [verify-ref, targets]
    if: needs.verify-ref.outputs.published != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.verify-ref.outputs.tag }}
      targets_artifact: ${{ needs.targets.outputs.artifact }}
      plugin: ${{ needs.verify-ref.outputs.plugin }}
      package_tag: ${{ needs.verify-ref.outputs.version_tag }}
  integration:
    needs: [verify-ref, targets]
    if: needs.verify-ref.outputs.published != 'true' && contains(fromJSON('["all","account-hub","deletion-queue","automatic-deletion-requests"]'), needs.verify-ref.outputs.plugin)
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.verify-ref.outputs.tag }}
      package_tag: ${{ needs.verify-ref.outputs.version_tag }}
      targets_artifact: ${{ needs.targets.outputs.artifact }}
      external_only: ${{ needs.verify-ref.outputs.plugin != 'all' }}
  package:
    needs: [verify-ref, targets, checks, integration]
    if: ${{ !cancelled() && needs.verify-ref.outputs.published != 'true' && needs.verify-ref.result == 'success' && needs.targets.result == 'success' && needs.checks.result == 'success' && (needs.integration.result == 'success' || (needs.integration.result == 'skipped' && !contains(fromJSON('["all","account-hub","deletion-queue","automatic-deletion-requests"]'), needs.verify-ref.outputs.plugin))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ref.outputs.tag }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - if: needs.verify-ref.outputs.plugin == 'all' || needs.verify-ref.outputs.plugin == 'private-syncplay'
        run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Preserve this plugin's published catalog history
        if: needs.verify-ref.outputs.plugin != 'all'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ needs.verify-ref.outputs.plugin }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          New-Item -ItemType Directory -Path previous | Out-Null
          $tags = @(gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if ($LASTEXITCODE) { throw 'Cannot read release history' }
          $releases = @($tags | Where-Object { $_ -match "^$([regex]::Escape($env:PLUGIN))/v\d+\.\d+\.\d+$" } | Sort-Object { [version]($_.Split('/')[-1].Substring(1)) } -Descending)
          if (!$releases.Count) { $releases = @($tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Substring(1) } -Descending) }
          if ($releases.Count) {
            gh release download $releases[0] --pattern "manifest-$env:RUNTIME.json" --dir previous
            if ($LASTEXITCODE) { throw 'Cannot download published history; refusing to discard it' }
          } else { '[]' | Set-Content "previous/manifest-$env:RUNTIME.json" }
      - name: Package selected plugins
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
          VERSION_TAG: ${{ needs.verify-ref.outputs.version_tag }}
          PLUGIN: ${{ needs.verify-ref.outputs.plugin }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          $history = if ($env:PLUGIN -eq 'all') { @{} } else { @{ PreviousManifest = "previous/manifest-$env:RUNTIME.json" } }
          ./scripts/package.ps1 -Tag $env:VERSION_TAG -ReleaseTag $env:RELEASE_TAG -Plugin $env:PLUGIN -Repository $env:RELEASE_REPOSITORY -Runtime $env:RUNTIME -OutputDirectory artifacts/suite-packages @history
          Copy-Item artifacts/suite-packages/manifest.json "artifacts/suite-packages/manifest-$env:RUNTIME.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: suite-packages-${{ matrix.runtime }}
          path: |
            artifacts/suite-packages/*.zip
            artifacts/suite-packages/*.sha256
            artifacts/suite-packages/*.cdx.json
            artifacts/suite-packages/*.licenses.json
            artifacts/suite-packages/manifest-${{ matrix.runtime }}.json
  publish:
    needs: [verify-ref, targets, checks, integration, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plugin-release
    concurrency:
      group: publish-${{ needs.verify-ref.outputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ref.outputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: suite-packages-*
          path: release
          merge-multiple: true
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
          verify_sdk: 'false'
      - name: Fail loudly if dependencies or upstream releases changed after acceptance
        run: |
          node scripts/check-dependency-freshness.mjs --refresh
          node scripts/assert-latest-targets.mjs
      - name: Validate the exact selected release set and three manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
          VERSION_TAG: ${{ needs.verify-ref.outputs.version_tag }}
          PLUGIN: ${{ needs.verify-ref.outputs.plugin }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/validate-release-set.ps1 -Directory release -Tag $env:VERSION_TAG -ReleaseTag $env:RELEASE_TAG -Plugin $env:PLUGIN -Repository $env:RELEASE_REPOSITORY
      - name: Publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
          PLUGIN: ${{ needs.verify-ref.outputs.plugin }}
        run: |
          git log -1 --format=%B | Set-Content release-notes.txt
          Add-Content release-notes.txt "`nSelected plugins: $env:PLUGIN. Linux x64, Linux ARM64 and Windows x64. Integration preview; see documented acceptance limits."
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "$env:PLUGIN $env:RELEASE_TAG" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release exists or creation failed; assets will not be overwritten' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem release -File | ForEach-Object FullName)
          if ($LASTEXITCODE) { throw 'Upload failed; release remains draft' }
          gh release edit $env:RELEASE_TAG --draft=false --latest=false
          if ($LASTEXITCODE) { throw 'Could not publish uploaded release' }
  update-manifest:
    needs: [verify-ref, publish]
    if: ${{ !cancelled() && needs.verify-ref.result == 'success' && (needs.verify-ref.outputs.published == 'true' || needs.publish.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifest.yml
    with:
      plugin: ${{ needs.verify-ref.outputs.plugin }}
      release_tag: ${{ needs.verify-ref.outputs.tag }}
