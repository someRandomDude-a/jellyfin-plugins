name: Release all plugins
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable suite version (for example v0.3.0)'
        required: true
        type: string
      ref:
        description: 'Optional exact source commit (dependency automation uses the tested merge SHA)'
        required: false
        type: string
      expected_commit:
        description: 'Optional fail-closed exact commit assertion'
        required: false
        type: string
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: suite-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      published: ${{ steps.ref.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: ref
        # No tag or publication happens until current tools/source pass preflight.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          ./scripts/bootstrap-tools.ps1
          node scripts/check-dependency-freshness.mjs
          if ($LASTEXITCODE) { throw 'Run and merge dependency maintenance before releasing this immutable source' }
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Enter a version such as v0.3.0' }
          if ($env:EXPECTED_COMMIT -and ((git rev-parse HEAD) -cne $env:EXPECTED_COMMIT -or $env:EXPECTED_COMMIT -cnotmatch '^[a-f0-9]{40}$')) { throw 'Checkout differs from tested immutable source' }
          git fetch --tags
          if ($LASTEXITCODE) { throw 'Cannot read immutable tags' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $commit = git rev-parse "$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE) { throw 'Cannot resolve existing tag' }
            if ($env:EXPECTED_COMMIT -and $commit -cne $env:EXPECTED_COMMIT) { throw 'Existing immutable tag belongs to another commit' }
            $selectedCommit = git rev-parse HEAD
            if ($LASTEXITCODE) { throw 'Cannot resolve selected release source' }
            node scripts/assert-release-source.mjs "$selectedCommit" "$commit"
            if ($LASTEXITCODE) { throw 'Release source differs from the existing immutable tag; use a new version for the fixes' }
          } else {
            git tag $env:RELEASE_TAG HEAD
            if ($LASTEXITCODE) { throw 'Tag creation failed' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE) { throw 'Tag push failed; no tag will be overwritten' }
          }
          $tags = @(gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft == false) | .tag_name')
          if ($LASTEXITCODE) { throw 'Cannot inspect published releases' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "published=$(([bool]($tags -ccontains $env:RELEASE_TAG)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  targets:
    needs: verify-ref
    if: needs.verify-ref.outputs.published != 'true'
    uses: ./.github/workflows/latest-targets.yml
    with:
      ref: ${{ needs.verify-ref.outputs.tag }}
      key: release-all
  checks:
    needs: [verify-ref, targets]
    if: needs.verify-ref.outputs.published != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.verify-ref.outputs.tag }}
      targets_artifact: ${{ needs.targets.outputs.artifact }}
  integration:
    needs: [verify-ref, targets]
    if: needs.verify-ref.outputs.published != 'true'
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.verify-ref.outputs.tag }}
      package_tag: ${{ needs.verify-ref.outputs.tag }}
      targets_artifact: ${{ needs.targets.outputs.artifact }}
  package:
    needs: [verify-ref, targets, checks, integration]
    if: needs.verify-ref.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ref.outputs.tag }}
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
      - run: npm ci --ignore-scripts
        working-directory: plugins/private-syncplay
      - name: Package all six plugins
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/package.ps1 -Tag $env:RELEASE_TAG -Plugin all -Repository $env:RELEASE_REPOSITORY -Runtime $env:RUNTIME -OutputDirectory artifacts/suite-packages
          Copy-Item artifacts/suite-packages/manifest.json "artifacts/suite-packages/manifest-$env:RUNTIME.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: suite-packages-${{ matrix.runtime }}
          path: |
            artifacts/suite-packages/*.zip
            artifacts/suite-packages/*.sha256
            artifacts/suite-packages/*.cdx.json
            artifacts/suite-packages/*.licenses.json
            artifacts/suite-packages/manifest-${{ matrix.runtime }}.json
  publish:
    needs: [verify-ref, targets, checks, integration, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ref.outputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: suite-packages-*
          path: release
          merge-multiple: true
      - uses: ./.github/actions/use-latest-targets
        with:
          artifact: ${{ needs.targets.outputs.artifact }}
          verify_sdk: 'false'
      - name: Fail loudly if dependencies or upstream releases changed after acceptance
        run: |
          node scripts/check-dependency-freshness.mjs
          node scripts/assert-latest-targets.mjs
      - name: Validate all 18 packages and three manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/validate-release-set.ps1 -Directory release -Tag $env:RELEASE_TAG -Plugin all -Repository $env:RELEASE_REPOSITORY
      - name: Publish immutable suite release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-ref.outputs.tag }}
        run: |
          git log -1 --format=%B | Set-Content release-notes.txt
          Add-Content release-notes.txt "`nAll six plugins for Linux x64, Linux ARM64 and Windows x64. Integration preview; see documented acceptance limits."
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "All plugins $env:RELEASE_TAG" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release exists or creation failed; assets will not be overwritten' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem release -File | ForEach-Object FullName)
          if ($LASTEXITCODE) { throw 'Upload failed; release remains draft' }
          gh release edit $env:RELEASE_TAG --draft=false --latest=false
          if ($LASTEXITCODE) { throw 'Could not publish uploaded release' }
  update-manifest:
    needs: [verify-ref, publish]
    if: ${{ !cancelled() && needs.verify-ref.result == 'success' && (needs.verify-ref.outputs.published == 'true' || needs.publish.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifest.yml
    with:
      plugin: all
      release_tag: ${{ needs.verify-ref.outputs.tag }}
