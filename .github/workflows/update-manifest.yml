name: Update plugin manifests
on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Published plugin to merge into catalogs'
        required: true
        type: choice
        options: [private-syncplay, account-hub, discord-bridge, deletion-queue, notifications, all]
      release_tag:
        description: 'Published version (v0.2.0) or full plugin/v0.2.0 tag'
        required: true
        type: string
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: plugin-release
    concurrency:
      group: manifest-${{ inputs.plugin }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate immutable published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.plugin }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:PLUGIN -notin @('all','account-hub','discord-bridge','private-syncplay','deletion-queue','notifications')) { throw 'Unknown plugin' }
          if ($env:PLUGIN -eq 'all') {
            if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Suite releases require vX.Y.Z' }
            $versionTag = $env:RELEASE_TAG
          } else {
            if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$') { $env:RELEASE_TAG = "$env:PLUGIN/$env:RELEASE_TAG" }
            if ($env:RELEASE_TAG -notmatch "^$([regex]::Escape($env:PLUGIN))/(v\d+\.\d+\.\d+)$") { throw 'Release tag must belong to selected plugin' }
            $versionTag = $Matches[1]
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -or $release.isDraft -or $release.tagName -cne $env:RELEASE_TAG) { throw 'An existing published release is required' }
          gh release download $env:RELEASE_TAG --dir release
          if ($LASTEXITCODE) { throw 'Cannot download published release assets' }
          ./scripts/validate-release-set.ps1 -Directory release -Tag $versionTag -ReleaseTag $env:RELEASE_TAG -Plugin $env:PLUGIN -Repository $env:GH_REPO
      - name: Update the three combined architecture catalogs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          ./scripts/publish-combined-catalog.ps1 -Repository $env:GH_REPO -Directory release -AllPlugins:($env:PLUGIN -eq 'all')
