name: Release Deletion Queue
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to create, for example v0.2.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      plugin: deletion-queue
      tag: ${{ inputs.tag }}
      branch: ${{ github.ref }}
