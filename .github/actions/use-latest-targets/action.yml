name: Bind this job to the current workflow targets
description: Download the parent's target evidence and regenerate runner-local build properties; never rediscover older targets.
inputs:
  artifact:
    required: true
    description: Target artifact emitted by latest-targets.yml
  verify_sdk:
    default: 'true'
    description: Verify installed SDK for build/test jobs; publish-only or tunnel jobs set false.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-latest-tools
    - uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: artifacts/workflow-targets
    - shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        SUITE_TEST_TARGETS: ${{ github.workspace }}/artifacts/workflow-targets/targets.json
        SUITE_DEPENDENCY_AUDIT: ${{ github.workspace }}/artifacts/workflow-targets/dependency-audit.json
        VERIFY_BUILD_SDK: ${{ inputs.verify_sdk }}
      run: |
        "SUITE_DEPENDENCY_AUDIT=$env:SUITE_DEPENDENCY_AUDIT" >> $env:GITHUB_ENV
        node scripts/check-dependency-freshness.mjs
        if ($LASTEXITCODE) { throw 'Parent dependency audit does not match this source/run' }
        node scripts/prepare-test-targets.mjs --services=jellyfin "--output=$env:SUITE_TEST_TARGETS"
        if ($LASTEXITCODE) { throw 'Latest-only target binding failed; refusing an independent/fallback target' }
