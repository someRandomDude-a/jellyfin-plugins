name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Build.props', '**/*.csproj', 'Jellyfin.Plugin.UserManager.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.UserManager.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.UserManager.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test Jellyfin.Plugin.UserManager.slnx -c Release --no-build --nologo

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-user-manager-package
          path: |
            dist/*.zip
            dist/*.md5
            dist/manifest.json
          if-no-files-found: error
