name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.UserManager.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.UserManager.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test Jellyfin.Plugin.UserManager.slnx -c Release --no-build --nologo

      - name: Package release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+(\.\d+){0,3}$') {
              throw "Release tags must look like v1.2.3 or v1.2.3.4 (got '$tag')."
          }

          $version = $tag.Substring(1)
          ./scripts/package.ps1 -Version $version -ReleaseTag $tag -Configuration Release

          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          if (-not $zip) {
              throw "The release package was not created."
          }

          $manifest = Get-Content dist/manifest.json -Raw | ConvertFrom-Json
          $sourceUrl = $manifest[0].versions[0].sourceUrl
          if ($sourceUrl -notlike "*/releases/download/$tag/*") {
              throw "Manifest sourceUrl does not point at tag $tag`: $sourceUrl"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
              (Get-ChildItem dist/*.zip).FullName
              (Get-ChildItem dist/*.md5).FullName
              (Resolve-Path dist/manifest.json).Path
          )

          gh release create $tag $assets --title "User Manager $tag" --generate-notes --verify-tag
