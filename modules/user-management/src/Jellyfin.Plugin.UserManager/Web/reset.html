<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Reset password · User Manager</title>
    <script>
        (function () {
            var path = location.pathname || '/';
            var index = path.toLowerCase().indexOf('/usermanager');
            var prefix = index >= 0 ? path.substring(0, index) : '';
            document.write('<base href="' + location.origin + prefix + '/UserManager/">');
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="um-shell">
    <div class="um-auth">
        <div class="um-card">
            <div class="um-brand" style="margin-bottom:16px">
                <h1>Reset your password</h1>
                <span>Jellyfin User Manager</span>
            </div>
            <div id="reset-main">
                <div class="um-loading"><span class="um-spinner"></span>Checking your reset link…</div>
            </div>
            <div class="um-row between" style="margin-top:18px">
                <a class="um-link" id="login-link" href="#">Back to sign in</a>
                <a class="um-link" id="request-again" href="#" hidden>Request another link</a>
            </div>
        </div>
        <div class="um-footer">Passwords are hashed and stored by Jellyfin. Reset links are single-use and expire after 30 minutes.</div>
    </div>
</div>

<script src="common.js"></script>
<script src="reset.js"></script>
</body>
</html>
