name: jellyfin-user-manager

# Integration sandbox for manual testing against the versions this plugin targets.
# The plugin is mounted from dist/plugin, so run ./scripts/package.ps1 first.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.3
    container_name: jellyfin-usermanager
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLIC_URL:-http://localhost:8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./dist/plugin:/config/plugins/Jellyfin.Plugin.UserManager
    networks:
      - usermanager

  seerr:
    image: seerr/seerr:v3.5.1
    container_name: seerr-usermanager
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "5055"
    ports:
      - "${SEERR_PORT:-5055}:5055"
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - jellyfin
    networks:
      - usermanager

networks:
  usermanager:

volumes:
  jellyfin-config:
  jellyfin-cache:
  seerr-config:
