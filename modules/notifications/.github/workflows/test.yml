name: test
on: [push, pull_request]
jobs:
  module:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet test tests/AccountHub.Notifications.Tests/AccountHub.Notifications.Tests.csproj -c Release
      - run: node --test tests/web/bell.test.cjs
